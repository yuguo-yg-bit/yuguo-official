<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服中心 - 玉国科技</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
        .chat-header { background: #121212; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .chat-header h2 { color: #ffd700; font-size: 18px; font-weight: 600; }
        .chat-header a { color: #ffd700; text-decoration: none; font-size: 16px; }
        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; }
        .msg.service { align-self: flex-start; background: #1a1a1a; color: #eee; border-bottom-left-radius: 4px; }
        .msg.user { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 4px; border: 1px solid #333; }
        .msg .time { font-size: 11px; color: #888; margin-top: 4px; text-align: right; }
        .order-inline { background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-top: 6px; font-size: 13px; }
        .order-inline .on { color: #ffd700; font-weight: bold; }
        .order-inline p { color: #aaa; margin: 3px 0; }
        .chat-footer { background: #121212; padding: 12px; border-top: 1px solid #222; display: flex; gap: 8px; align-items: center; }
        .chat-footer input { flex: 1; padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 24px; color: #fff; outline: none; }
        .chat-footer input:focus { border-color: #ffd700; }
        .chat-footer .send-btn { padding: 0 20px; height: 42px; background: #ffd700; color: #000; font-weight: bold; border: none; border-radius: 24px; cursor: pointer; }
        .chat-footer .order-btn { padding: 10px 14px; background: #1a1a1a; color: #ffd700; border: 1px solid #ffd700; border-radius: 8px; white-space: nowrap; cursor: pointer; font-size: 13px; }
        .no-login { text-align: center; padding: 60px 20px; }
        .no-login h3 { color: #ffd700; font-size: 24px; margin-bottom: 12px; }
        .no-login a { color: #ffd700; }
    </style>
</head>
<body>

<div class="chat-header">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> 返回</a>
    <h2><i class="fa-solid fa-headset"></i> 客服中心</h2>
    <div></div>
</div>

<div class="chat-body" id="chatBox">
    <div class="msg service">您好！我是玉国科技客服，有什么可以帮您的？<div class="time">刚刚</div></div>
</div>

<div class="chat-footer">
    <button class="order-btn" id="sendOrder"><i class="fa-solid fa-receipt"></i> 我的订单</button>
    <input type="text" id="msgInput" placeholder="输入消息...">
    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i> 发送</button>
</div>

<script>
const GITHUB_CONFIG = {
    username: "yuguo-yg-bit",
    repo: "yuguo-official",
    token: "ghp_sVylTqJv8nv"+"K3SK3wS2qidM6AvQAFx1rAvCd"
};
const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

const chatBox = document.getElementById('chatBox');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const sendOrderBtn = document.getElementById('sendOrder');

function nowTime() { return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}); }

function addMessage(text, isUser, isOrder) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user' : 'service');
    if (isOrder) {
        div.innerHTML = text + '<div class="time">' + nowTime() + '</div>';
    } else {
        div.innerHTML = text + '<div class="time">' + nowTime() + '</div>';
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.addEventListener('click', () => {
    const text = msgInput.value.trim();
    if (!text) return;
    addMessage(text, true);
    msgInput.value = '';
    setTimeout(() => {
        addMessage('收到您的消息，客服会尽快回复您～如需查看订单请点击下方「我的订单」按钮', false);
    }, 600);
});

msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendBtn.click();
});

sendOrderBtn.addEventListener('click', async () => {
    if (!currentUser) {
        addMessage('请先<a href="login.html" style="color:#ffd700;">登录</a>后再查看订单', false);
        return;
    }
    try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/issues?labels=payment-record&state=all&per_page=50`, {
            headers: { Authorization: `token ${GITHUB_CONFIG.token}` }
        });
        const all = await res.json();
        const myOrders = all.filter(i => i.body?.includes(currentUser.phone));
        if (myOrders.length === 0) {
            addMessage('您暂无订单记录', false);
            return;
        }
        let html = '<b>📋 您的订单：</b>';
        myOrders.slice(0, 10).forEach(o => {
            const no = (o.body.match(/订单号：(.+)/) || [''])[1] || '未知';
            const product = (o.body.match(/商品[名称]?[：:](.+)/) || ['', '未知'])[1];
            const progress = (o.body.match(/物流进度：(\d+)/) || ['', '0'])[1];
            const statusMap = ['已提交','待审核','已出库','运输中','运输中','运输中','运输中','已签收'];
            const status = statusMap[+progress] || '处理中';
            html += '<div class="order-inline"><p class="on">' + no + '</p><p>' + product.trim() + '</p><p>状态：' + status + '</p></div>';
        });
        if (myOrders.length > 10) html += '<p style="font-size:13px;color:#888;">...仅显示最近10条</p>';
        addMessage(html, true, true);
    } catch(e) {
        addMessage('获取订单失败，请稍后重试', false);
    }
});

if (!currentUser) {
    setTimeout(() => {
        addMessage('⚠️ 您尚未登录，部分功能不可用。<br>请先<a href="login.html" style="color:#ffd700;">登录</a>或<a href="register.html" style="color:#ffd700;">注册</a>', false);
    }, 500);
}
</script>
</body>
</html>
