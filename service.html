<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服中心 - 玉国科技</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
        .chat-header { background: #121212; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .chat-header h2 { color: #ffd700; font-size: 18px; font-weight: 600; }
        .chat-header a { color: #ffd700; text-decoration: none; font-size: 16px; }
        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
        .msg.service { align-self: flex-start; background: #1a1a1a; color: #eee; border-bottom-left-radius: 4px; }
        .msg.user { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 4px; border: 1px solid #333; }
        .msg .time { font-size: 11px; color: #888; margin-top: 4px; text-align: right; }
        .order-inline { background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-top: 6px; font-size: 13px; }
        .order-inline .on { color: #ffd700; font-weight: bold; }
        .order-inline p { color: #aaa; margin: 3px 0; }
        .chat-footer { background: #121212; padding: 12px; border-top: 1px solid #222; display: flex; gap: 8px; align-items: center; }
        .chat-footer input { flex: 1; padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 24px; color: #fff; outline: none; }
        .chat-footer input:focus { border-color: #ffd700; }
        .chat-footer .send-btn { padding: 0 20px; height: 42px; background: #ffd700; color: #000; font-weight: bold; border: none; border-radius: 24px; cursor: pointer; }
        .chat-footer .send-btn:disabled { opacity: .5; cursor: not-allowed; }
        .chat-footer .order-btn { padding: 10px 14px; background: #1a1a1a; color: #ffd700; border: 1px solid #ffd700; border-radius: 8px; white-space: nowrap; cursor: pointer; font-size: 13px; }
        .no-login { text-align: center; padding: 60px 20px; }
        .no-login h3 { color: #ffd700; font-size: 24px; margin-bottom: 12px; }
        .no-login a { color: #ffd700; }
        .loading-tip { align-self: center; color: #666; font-size: 13px; margin-top: 8px; }
        .sys-tip { align-self: center; background: #161616; border: 1px dashed #333; color: #999; font-size: 12px; padding: 6px 14px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="chat-header">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> 返回</a>
    <h2><i class="fa-solid fa-headset"></i> 客服中心</h2>
    <div id="loginState" class="text-xs" style="color:#888;"></div>
</div>

<div class="chat-body" id="chatBox">
    <div class="loading-tip">正在连接客服...</div>
</div>

<div class="chat-footer" id="chatFooter" style="display:none;">
    <button class="order-btn" id="sendOrder"><i class="fa-solid fa-receipt"></i> 我的订单</button>
    <input type="text" id="msgInput" placeholder="输入消息...">
    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i> 发送</button>
</div>

<div class="chat-footer" id="loginFooter" style="display:none; justify-content:center; gap:12px;">
    <a href="login.html" class="send-btn" style="text-decoration:none; display:flex; align-items:center;">登录后咨询客服</a>
    <a href="register.html" class="order-btn" style="text-decoration:none; display:flex; align-items:center;">注册账号</a>
</div>

<script src="chat.js"></script>
<script>
// 接口配置统一由 chat.js 提供，此处不再重复硬编码
const API = YuguoChat.API;
const HEADERS = YuguoChat.HEADERS;

const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

const chatBox = document.getElementById('chatBox');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

let conv = null;        // 会话 issue
let rendered = 0;       // 已渲染到第几条（按位置计）
let pollTimer = null;
let sending = false;

const esc = YuguoChat.esc;

function renderBubble(text, isUser, time) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user' : 'service');
    div.textContent = text;
    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = time || YuguoChat.stamp();
    div.appendChild(t);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function renderTip(text) {
    const div = document.createElement('div');
    div.className = 'sys-tip';
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// 增量渲染：只画新消息
async function syncMessages() {
    if (!conv) return;
    const msgs = await YuguoChat.listMessages(conv.number);
    if (rendered === 0 && msgs.length) chatBox.innerHTML = '';   // 首次载入历史
    msgs.slice(rendered).forEach(m => {
        const at = new Date(m.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        renderBubble(m.text, m.role === '顾客', m.time || at);
    });
    rendered = msgs.length;
    return msgs.length;
}

async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || sending || !conv) return;
    sending = true; sendBtn.disabled = true;
    try {
        await YuguoChat.postMessage(conv.number, '顾客', text);
        msgInput.value = '';
        await syncMessages();
        msgInput.focus();
    } catch (e) {
        renderTip('发送失败，请稍后重试');
    } finally {
        sending = false; sendBtn.disabled = false;
    }
}

function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => { if (!document.hidden) syncMessages(); }, 5000);
}
function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopPolling();
    else { syncMessages(); startPolling(); }
});

document.getElementById('sendOrder').addEventListener('click', async () => {
    try {
        const res = await fetch(`${API}/issues?labels=payment-record&state=all&per_page=50`, { headers: HEADERS });
        const all = await res.json();
        const mine = (Array.isArray(all) ? all : []).filter(i => i.body?.includes(currentUser.phone));
        if (!mine.length) { renderTip('您暂无订单记录'); return; }
        let html = '<b>📋 您的订单：</b>';
        mine.slice(0, 10).forEach(o => {
            const no = (o.body.match(/订单号：(.+)/) || [''])[1] || '未知';
            const product = (o.body.match(/商品[名称]?[：:](.+)/) || ['', '未知'])[1];
            const progress = (o.body.match(/物流进度：(\d+)/) || ['', '0'])[1];
            const status = ['已提交','待审核','已出库','运输中','运输中','运输中','运输中','已签收'][+progress] || '处理中';
            html += '<div class="order-inline"><p class="on">' + esc(no) + '</p><p>' + esc(product.trim()) + '</p><p>状态：' + status + '</p></div>';
        });
        if (mine.length > 10) html += '<p style="font-size:13px;color:#888;">...仅显示最近10条</p>';
        const div = document.createElement('div');
        div.className = 'msg user';
        div.innerHTML = html + '<div class="time">' + YuguoChat.stamp() + '</div>';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    } catch (e) {
        renderTip('获取订单失败，请稍后重试');
    }
});

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

window.addEventListener('load', async () => {
    if (!currentUser) {
        chatBox.innerHTML = `
            <div class="no-login">
                <h3>⚠️ 您尚未登录</h3>
                <p style="color:#aaa; margin-bottom:16px;">登录后即可与玉国科技客服实时对话</p>
                <a href="login.html">去登录 →</a>
            </div>`;
        document.getElementById('loginFooter').style.display = 'flex';
        return;
    }
    document.getElementById('loginState').textContent = currentUser.phone;
    document.getElementById('chatFooter').style.display = 'flex';
    try {
        conv = await YuguoChat.ensureConversation(currentUser.phone);
        const count = await syncMessages();
        if (!count) {
            chatBox.innerHTML = '';
            renderBubble('您好！我是玉国科技客服，有什么可以帮您的？', false);
            renderTip('客服会实时收到您的消息，请稍候回复');
        }
        startPolling();
    } catch (e) {
        console.error(e);
        chatBox.innerHTML = '<div class="loading-tip" style="color:#ef4444;">连接客服失败，请刷新重试</div>';
    }
});
</script>
</body>
</html>
